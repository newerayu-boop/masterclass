<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kurs dasturi — A: sticky sahna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="./var.css">
<style>
.a-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:70px}
.a-stage{position:sticky;top:calc(50vh - 260px);padding-top:6px}
.a-frame{position:relative;aspect-ratio:4/3;border-radius:28px;overflow:hidden;background:#0d0c0a;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px rgba(227,192,112,.3),0 0 90px rgba(201,168,76,.16);transform:perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.a-slide{position:absolute;inset:0;z-index:1;clip-path:circle(0% at 50% 50%);transition:clip-path .95s cubic-bezier(.65,0,.2,1)}
.a-slide.open{clip-path:circle(150% at 50% 50%)}
.a-slide.notrans{transition:none}
.a-slide .bg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(26px) saturate(1.2) brightness(.7)}
.a-slide .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scale(1.06);transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.a-slide.open .fg{transform:none}
.a-scan{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(180deg,transparent 40%,rgba(255,236,190,.38) 50%,transparent 60%);transform:translateY(-110%)}
.a-scan.go{animation:a-scan 1s cubic-bezier(.5,0,.3,1) both}
@keyframes a-scan{to{transform:translateY(110%)}}
.a-hud{position:absolute;left:16px;right:16px;top:16px;z-index:6;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.a-chip{padding:7px 12px;border:1px solid rgba(227,192,112,.55);border-radius:999px;background:rgba(11,11,10,.7);backdrop-filter:blur(8px);color:var(--pale);font-size:12px;font-weight:800;letter-spacing:.1em}
.a-count{color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.a-count i{font-style:normal;color:var(--gold2)}
.a-cp{position:absolute;left:16px;bottom:16px;z-index:6;opacity:0;transform:translateY(8px);transition:opacity .4s ease .5s,transform .4s ease .5s}
.a-cp.on{opacity:1;transform:none}
.a-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:18px}
.a-bar button{height:6px;border:0;border-radius:9px;background:#26221b;cursor:pointer;padding:0;position:relative;overflow:hidden}
.a-bar button:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#8b6f2c,#e3c070);transform:scaleX(0);transform-origin:left;transition:transform .6s ease}
.a-bar button.done:after,.a-bar button.cur:after{transform:scaleX(1)}
.a-bar button.cur{box-shadow:0 0 12px rgba(227,192,112,.7)}
.a-step{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:16px;opacity:.28;transition:opacity .5s ease}
.a-step.on{opacity:1}
.a-step:first-child{padding-top:4vh}
.a-top{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.a-wk{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.2em}
.a-step h3{margin:0;color:#fff;font-size:clamp(28px,3.2vw,42px);font-weight:800;letter-spacing:-.045em;line-height:1.08}
.a-promise{margin:0;max-width:44ch;color:var(--pale);font-size:18px;font-weight:600;line-height:1.5}
.a-step .ls,.a-step .res{transform:translateY(14px);opacity:0;transition:opacity .6s ease .1s,transform .6s ease .1s}
.a-step.on .ls,.a-step.on .res{opacity:1;transform:none}
.a-step.on .res{transition-delay:.25s}
.a-mimg{display:none}
@media(max-width:900px){
 .a-grid{grid-template-columns:1fr}
 .a-left{display:none}
 .a-step{min-height:0;opacity:1;margin-bottom:70px;padding:0!important}
 .a-step .ls,.a-step .res{opacity:1;transform:none}
 .a-mimg{display:block;position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:#0d0c0a;box-shadow:0 0 0 1px rgba(227,192,112,.3),0 24px 60px rgba(0,0,0,.5)}
 .a-mimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
 .a-mimg img.bg{object-fit:cover;filter:blur(24px) brightness(.7);transform:scale(1.15)}
}
@media(prefers-reduced-motion:reduce){.a-slide,.a-slide .fg,.a-frame{transition:none}.a-scan{display:none}}
</style>
</head>
<body>
<div class="vtag">A · Sticky sahna</div>
<header class="wrap head">
 <div class="eb">Kurs dasturi</div>
 <h2 class="h2">6 hafta · <span class="gold">12 jonli dars</span> · 4 artefakt</h2>
 <p class="lead">Har hafta — aniq va’da, amaliy darslar va qo‘lingizda qoladigan natija. Pastga aylantiring: chapdagi sahna dasturga qarab o‘zgaradi.</p>
</header>
<main class="wrap">
 <div class="a-grid">
  <div class="a-left"><div class="a-stage">
   <div class="a-frame" id="frame"><div class="a-hud"><span class="a-chip" id="chip">1-HAFTA</span><span class="a-count"><i id="cur">01</i> / 06</span></div><div class="a-scan" id="scan"></div><div class="a-cp"><span class="cp" id="cp"></span></div></div>
   <div class="a-bar" id="bar" role="tablist" aria-label="Haftalar"></div>
  </div></div>
  <div class="a-steps" id="steps"></div>
 </div>
</main>
<div class="end">Variant A — sticky sahna</div>
<script src="./weeks.js"></script>
<script>
(() => {
  const W = window.WEEKS, reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frame = document.getElementById('frame'), steps = document.getElementById('steps'), bar = document.getElementById('bar');
  const chip = document.getElementById('chip'), cur = document.getElementById('cur'), cp = document.getElementById('cp'), scan = document.getElementById('scan');
  const slides = [], stepEls = [], dots = [];
  W.forEach((w, i) => {
    const s = document.createElement('div'); s.className = 'a-slide';
    s.innerHTML = `<img class="bg" src="${w.img}" alt=""><img class="fg" src="${w.img}" alt="${w.alt}">`;
    frame.insertBefore(s, frame.firstChild); slides.push(s);
    const st = document.createElement('article'); st.className = 'a-step'; st.dataset.i = i;
    st.innerHTML = `<div class="a-mimg"><img class="bg" src="${w.img}" alt=""><img src="${w.img}" alt="${w.alt}" loading="lazy"></div>
      <div class="a-top"><span class="a-wk">${w.wk}</span>${w.cp ? `<span class="cp">✓ Checkpoint · ${w.cp}</span>` : ''}</div>
      <h3>${w.title}</h3><p class="a-promise">${w.promise}</p>
      <ul class="ls">${w.lessons.map(([d, t]) => `<li><b>${d}</b><span>${t}</span></li>`).join('')}</ul>
      <div><div class="res"><small>Natija</small><b>${w.result}</b></div></div>`;
    steps.appendChild(st); stepEls.push(st);
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', w.wk);
    b.onclick = () => stepEls[i].scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block: 'center'});
    bar.appendChild(b); dots.push(b);
  });
  slides.forEach((s) => s.classList.add('notrans'));
  slides.reverse().forEach((s, k) => { s.style.zIndex = 1; }); slides.reverse();
  slides[0].classList.add('open'); slides[0].style.zIndex = 2;
  let z = 2, active = 0;
  function activate(i, instant) {
    if (i === active && !instant) return;
    active = i;
    slides.forEach((s, k) => { if (k !== i) s.style.zIndex = 1; });
    const s = slides[i];
    s.classList.add('notrans'); s.classList.remove('open'); void s.offsetWidth;
    s.style.zIndex = ++z; s.classList.remove('notrans'); s.classList.add('open');
    scan.classList.remove('go'); void scan.offsetWidth; if (!reduced) scan.classList.add('go');
    stepEls.forEach((e, k) => e.classList.toggle('on', k === i));
    dots.forEach((d, k) => { d.classList.toggle('cur', k === i); d.classList.toggle('done', k < i); });
    chip.textContent = W[i].wk; cur.textContent = String(i + 1).padStart(2, '0');
    cp.textContent = W[i].cp ? '✓ Checkpoint · ' + W[i].cp : ''; cp.parentElement.classList.toggle('on', !!W[i].cp);
  }
  stepEls[0].classList.add('on'); dots[0].classList.add('cur');
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) activate(+e.target.dataset.i); }), {rootMargin: '-45% 0px -45% 0px'});
  stepEls.forEach((e) => io.observe(e));
  if (matchMedia('(hover: hover) and (pointer: fine)').matches && !reduced) {
    frame.addEventListener('pointermove', (e) => { const r = frame.getBoundingClientRect(); frame.style.setProperty('--ry', ((e.clientX - r.left) / r.width - .5) * 9 + 'deg'); frame.style.setProperty('--rx', -((e.clientY - r.top) / r.height - .5) * 7 + 'deg'); });
    frame.addEventListener('pointerleave', () => { frame.style.setProperty('--ry', '0deg'); frame.style.setProperty('--rx', '0deg'); });
  }
})();
</script>
</body>
</html>
